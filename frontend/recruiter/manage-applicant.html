<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Recruiter | Manage Applicants</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/manage-applicant.css">
</head>
<body class="bg-slate-50">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-white border-r border-slate-200 p-6 hidden md:block">
      <h1 class="text-xl font-bold text-indigo-600 mb-10">PlacementorAI</h1>
      <nav class="menu space-y-2">
        <a href="recruiter-dashboard.html">
          <i data-lucide="layout-dashboard"></i> Dashboard
        </a>
        <a href="postjob.html">
          <i data-lucide="plus-circle"></i> Post Job
        </a>
        <a href="manage-applicant.html" class="nav-link active">
          <i data-lucide="users"></i>
          <span>Manage Applicants</span>
        </a>
      </nav>
    </aside>

    <main class="flex-1 p-8">
      <header class="mb-8 flex items-center justify-between">
        <div>
          <h2 class="text-3xl font-bold text-slate-800">Review Applications</h2>
          <p class="text-slate-500">Manage student applications and filter by eligibility</p>
        </div>
        <button id="export-csv-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium shadow flex items-center gap-2 transition-colors">
          <i data-lucide="download"></i>
          Export to CSV
        </button>
      </header>

      <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <table class="w-full text-left">
          <thead class="bg-slate-50 border-b border-slate-200">
            <tr>
              <th class="p-4 text-xs font-bold text-slate-500 uppercase">Student Name</th>
              <th class="p-4 text-xs font-bold text-slate-500 uppercase">Applied For</th>
              <th class="p-4 text-xs font-bold text-slate-500 uppercase text-center">CGPA</th>
              <th class="p-4 text-xs font-bold text-slate-500 uppercase text-center">Resume</th>
              <th class="p-4 text-xs font-bold text-slate-500 uppercase">Status</th>
              <th class="p-4 text-xs font-bold text-slate-500 uppercase">Actions</th>
            </tr>
          </thead>
          <tbody id="recruiter-table-body" class="divide-y divide-slate-100">
          </tbody>
        </table>

        <!-- ✅ Empty State UI -->
        <div id="emptyState" class="hidden text-center py-16 text-slate-400">
          <i data-lucide="inbox" class="w-16 h-16 mx-auto mb-4 opacity-30"></i>
          <h3 class="text-lg font-semibold text-slate-600">
            No applications received yet
          </h3>
          <p class="text-sm mt-1">
            Post a job to start receiving applications.
          </p>
          <a href="postjob.html"
            class="mt-4 inline-block bg-indigo-600 text-white 
            px-6 py-2 rounded-lg hover:bg-indigo-700 transition">
            Post a Job →
          </a>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/manage-applicant.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
